version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: pos_db
    environment:
      POSTGRES_DB: pos_saas
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: