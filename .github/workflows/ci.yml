name: Backend CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: pos_saas
          POSTGRES_USER: coder
          POSTGRES_PASSWORD: admin123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/pos_saas
          SPRING_DATASOURCE_USERNAME: coder
          SPRING_DATASOURCE_PASSWORD: admin123
          APP_JWT_SECRET: dev-secret-key-minimum-64-characters-long-change-in-production
        run: mvn clean verify -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pos-backend
          path: target/*.jar