spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_saas
    username: coder
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-64-characters-long-change-in-production-ok}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-key-minimum-64-characters-long-ok}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  resend:
    api-key: ${re_eGDY7spz_92WBgzVwYET3Xw5ayBJZq1Ze}
    from-email: ${RESEND_FROM_EMAIL:ammarbashirharuna2020@gmail.com}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  paystack:
    secret-key: ${PAYSTACK_SECRET:sk_test_placeholder}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:webhook_placeholder}
  cloudflare:
    r2-access-key: ${R2_ACCESS_KEY:placeholder}
    r2-secret-key: ${R2_SECRET_KEY:placeholder}
    r2-bucket: ${R2_BUCKET:pos-files}
    r2-endpoint: ${R2_ENDPOINT:placeholder}

logging:
  level:
    com.pos.pos_backend: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO