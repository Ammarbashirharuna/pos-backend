spring:
  application:
    name: pos-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_saas
    username: coder
    password: admin123
    driver-class-name: org.postgresql.Driver

jpa:
  open-in-view: false
  hibernate:
    ddl-auto: none
  show-sql: true
  properties:
    hibernate:
      multiTenancy: SCHEMA
      default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-on-validation-error: false
    repair-on-migrate: false
    clean-disabled: false

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

app:
  frontend-url: http://localhost:3000
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-64-characters-long-change-in-production-ok}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-key-minimum-64-characters-long-ok}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  resend:
    api-key: ${RESEND_API_KEY:re_eGDY7spz_92WBgzVwYET3Xw5ayBJZq1Ze}
    from-email: ${RESEND_FROM_EMAIL:ammarbashirharuna2020@gmail.com}
  paystack:
    secret-key: ${PAYSTACK_SECRET:sk_test_placeholder}
    webhook-secret: ${PAYSTACK_WEBHOOK_SECRET:webhook_placeholder}
  cloudflare:
    r2-access-key: ${R2_ACCESS_KEY:placeholder}
    r2-secret-key: ${R2_SECRET_KEY:placeholder}
    r2-bucket: ${R2_BUCKET:pos-files}
    r2-endpoint: ${R2_ENDPOINT:placeholder}

logging:
  level:
    com.pos.pos_backend: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO