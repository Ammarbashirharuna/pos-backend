spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_saas
    username: coder
    password: admin123
    driver-class-name: org.postgresql.Driver

jpa:
  open-in-view: false
  hibernate:
    ddl-auto: validate
  show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:testpass}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-64-characters-long-change-in-production}
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}