services:
  - type: web
    name: pos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    autoDeploy: true
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database
      - key: DATABASE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Frontend
      - key: FRONTEND_URL
        value: https://pos.appsware.ng

      # JWT
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # Resend (email)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@appsware.ng

      # Paystack
      - key: PAYSTACK_SECRET
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

      # Cloudflare R2
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: pos-files
      - key: R2_ENDPOINT
        sync: false